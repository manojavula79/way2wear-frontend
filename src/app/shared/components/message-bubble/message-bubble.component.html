<div class="user-row" *ngIf="isUser">
  <div class="user-bubble">{{ message.content }}</div>
</div>

<div class="ai-row" *ngIf="!isUser">
  <div class="ai-avatar">W</div>

  <div class="ai-body">
    <!-- ═══ DYNAMIC FORM (e.g. styling another person) ═══ -->
    <app-profile-form
      *ngIf="isProfileForm && !message.error"
      [message]="profileFormData?.message || ''"
      [formFields]="profileFormData?.form_fields || {}"
      [submitting]="submitting"
      (formSubmit)="onProfileFormSubmit($event)"
      (formSkip)="onProfileFormSkip()"
    >
    </app-profile-form>

    <!-- Error state -->
    <div class="error-msg" *ngIf="message.error">
      <span>⚠</span> {{ errorText }}
    </div>

    <!-- Normal AI response -->
    <ng-container *ngIf="!message.error && !isProfileForm && parsedResponse">

      <!-- Conversational message -->
      <p class="ai-text" *ngIf="parsedResponse.message">{{ parsedResponse.message }}</p>

      <!-- Styling tip -->
      <div class="tip-box" *ngIf="parsedResponse.tip">
        <span class="tip-icon">✦</span>
        <p>{{ parsedResponse.tip }}</p>
      </div>

      <!-- Outfit cards — INITIALLY SHOW 3 -->
      <app-outfit-card
        *ngFor="let outfit of displayedOutfits(); let i = index; trackBy: trackByOutfit"
        [outfit]="outfit"
        [index]="i"
        (viewDetails)="onOutfitViewDetails($event)"
      >
      </app-outfit-card>

      <!-- Load More button — appears after 3 outfits, up to 12 total -->
      <div class="load-more-wrap" *ngIf="hasMore()">
        <button class="load-more-btn" type="button" (click)="loadMore()">
          <span>Load {{ nextBatchCount() }} more {{ nextBatchCount() === 1 ? 'outfit' : 'outfits' }}</span>
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <p class="outfit-count">Showing {{ visibleCount() }} of {{ totalOutfitCount() }} outfits</p>
      </div>

      <!-- Empty outfits fallback -->
      <div class="empty-outfits" *ngIf="parsedResponse.outfits.length === 0 && parsedResponse.message">
        <p>Try describing the occasion or style you're going for and I'll generate outfit cards for you!</p>
      </div>

    </ng-container>

  </div>
</div>
<app-outfit-detail-modal
  *ngIf="showDetailModal"
  [outfit]="selectedOutfit"
  [isOpen]="showDetailModal"
  (close)="onCloseDetailModal()"
  (previewImage)="onPreviewImage($event)"
>
</app-outfit-detail-modal>
