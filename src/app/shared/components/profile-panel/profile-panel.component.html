<div class="profile-panel">

  <!-- Header -->
  <div class="panel-header">
    <h2 class="panel-title">Styling Profile</h2>
    <button class="close-btn" (click)="close()" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Stats row -->
  <div class="stats-row">
    <div class="stat-card">
      <svg class="stat-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 17L3.5 10.5a4 4 0 0 1 6.5-4.7A4 4 0 0 1 16.5 10.5L10 17Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <p class="stat-value">{{ profile().totalLikes }}</p>
      <p class="stat-label">LIKES</p>
    </div>
    <div class="stat-card">
      <svg class="stat-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="3" y="5" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7 5V4a2 2 0 0 1 6 0v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="stat-value">{{ profile().totalOrders }}</p>
      <p class="stat-label">ORDERS</p>
    </div>
    <div class="stat-card">
      <svg class="stat-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="2" y="5" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M2 9h16" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6 13h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="stat-value">{{ profile().plan }}</p>
      <p class="stat-label">PLAN</p>
    </div>
  </div>

  <!-- Styling Preferences -->
  <div class="section">
    <p class="section-label">Styling Preferences</p>

    <div class="pref-card">
      <p class="pref-label">Personal Style</p>
      <p class="pref-value">{{ profile().stylePreference }}</p>
    </div>

    <div class="pref-card">
      <p class="pref-label">Monthly Budget</p>
      <p class="pref-value">{{ profile().budgetRange }}</p>
    </div>
  </div>

  <!-- Menu actions -->
  <div class="menu-list">
    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M9 11.25a2.25 2.25 0 1 0 0-4.5 2.25 2.25 0 0 0 0 4.5Z" stroke="currentColor" stroke-width="1.4"/>
        <path d="M14.8 10.8a1 1 0 0 0 .2 1.1l.04.04a1.22 1.22 0 0 1-1.72 1.72l-.04-.04a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V14.5a1.22 1.22 0 0 1-2.44 0v-.08a1 1 0 0 0-.65-.9 1 1 0 0 0-1.1.2l-.04.04a1.22 1.22 0 0 1-1.72-1.72l.04-.04a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H3.5a1.22 1.22 0 0 1 0-2.44h.08a1 1 0 0 0 .9-.65 1 1 0 0 0-.2-1.1l-.04-.04A1.22 1.22 0 0 1 5.96 4.35l.04.04a1 1 0 0 0 1.1.2h.05a1 1 0 0 0 .6-.9V3.5a1.22 1.22 0 0 1 2.44 0v.08a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.04-.04a1.22 1.22 0 0 1 1.72 1.72l-.04.04a1 1 0 0 0-.2 1.1v.05a1 1 0 0 0 .9.6h.08a1.22 1.22 0 0 1 0 2.44h-.08a1 1 0 0 0-.9.6Z" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <span>Account Settings</span>
      <svg class="chevron" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <rect x="2" y="5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.4"/>
        <path d="M2 8h14" stroke="currentColor" stroke-width="1.4"/>
        <path d="M5 11.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span>Subscription</span>
      <svg class="chevron" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- Logout -->
  <div class="logout-section">
    <button class="logout-btn" (click)="logout()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 14H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M10.5 11L14 8l-3.5-3M14 8H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Logout
    </button>
  </div>

</div>
