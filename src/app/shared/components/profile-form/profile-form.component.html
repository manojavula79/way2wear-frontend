<div class="profile-form-card">

  <!-- Message from bot -->
  <p class="form-message">{{ message }}</p>

  <!-- GENDER FIELD (Required) -->
  <div class="form-field" *ngIf="formFields['gender']">
    <label class="field-label">
      Gender
      <span class="required" *ngIf="isRequired('gender')">*</span>
      <span class="optional" *ngIf="!isRequired('gender')">(Optional)</span>
    </label>
    <div class="button-group">
      <button
        *ngFor="let option of getOptions('gender')"
        class="option-button"
        [class.selected]="selectedGender === option.toLowerCase()"
        (click)="selectGender(option)"
        [disabled]="submitting"
      >
        {{ option }}
      </button>
    </div>
  </div>

  <!-- SKIN TONE FIELD (Optional) -->
  <div class="form-field" *ngIf="formFields['skin_tone']">
    <label class="field-label">
      Skin Tone
      <span class="required" *ngIf="isRequired('skin_tone')">*</span>
      <span class="optional" *ngIf="!isRequired('skin_tone')">(Optional)</span>
    </label>
    <div class="button-group">
      <button
        *ngFor="let option of getOptions('skin_tone')"
        class="option-button tone-button"
        [class.selected]="selectedSkinTone === option.toLowerCase()"
        [style.background]="getToneColor(option)"
        (click)="selectSkinTone(option)"
        [disabled]="submitting"
      >
        {{ option }}
      </button>
    </div>
  </div>

  <!-- SIZE FIELD (Optional) -->
  <div class="form-field" *ngIf="formFields['size']">
    <label class="field-label">
      Size
      <span class="required" *ngIf="isRequired('size')">*</span>
      <span class="optional" *ngIf="!isRequired('size')">(Optional)</span>
    </label>
    <select
      class="size-dropdown"
      [value]="selectedSize"
      (change)="selectSize($any($event.target).value)"
      [disabled]="submitting"
    >
      <option value="">Select size...</option>
      <option
        *ngFor="let option of getOptions('size')"
        [value]="option.toLowerCase()"
      >
        {{ option }}
      </option>
    </select>
  </div>

  <p class="form-error" *ngIf="validationError" role="alert">
    {{ validationError }}
  </p>

  <!-- Action Buttons -->
  <div class="form-actions">
    <button
      class="btn btn-primary"
      (click)="submitForm()"
      [disabled]="submitting"
    >
      <span *ngIf="!submitting">Continue</span>
      <span *ngIf="submitting">Loading...</span>
    </button>

    <button
      class="btn btn-secondary"
      (click)="skipForm()"
      [disabled]="submitting"
    >
      Skip for now
    </button>
  </div>

</div>
