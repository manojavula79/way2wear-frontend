<div class="outfit-card">

  <div class="card-header">
    <span class="outfit-index">Outfit {{ index + 1 }}</span>
    <h3 class="outfit-name">{{ outfit.name }}</h3>
  </div>

  <!-- Top + Bottom grid -->
  <div class="product-grid">

    <!-- TOP -->
    <div class="product-card">
      <div class="product-image" [style.background]="getSwatchBg(outfit.top.color)">
        <img
          *ngIf="outfit.top.image && !hasImgError('top')"
          [src]="outfit.top.image"
          [alt]="outfit.top.title"
          class="product-img"
          (error)="onImgError('top')"
        />
        <div *ngIf="!outfit.top.image || hasImgError('top')"
          class="color-swatch" [style.background]="outfit.top.color">
        </div>
        <span class="brand-badge" *ngIf="outfit.top.brand">{{ outfit.top.brand }}</span>
      </div>
      <div class="product-info">
        <span class="product-type">TOP</span>
        <p class="product-title">{{ outfit.top.title || 'Top Wear' }}</p>
        <p class="product-price" *ngIf="outfit.top.price">₹{{ outfit.top.price }}</p>
      </div>
    </div>

    <!-- BOTTOM -->
    <div class="product-card">
      <div class="product-image" [style.background]="getSwatchBg(outfit.bottom.color)">
        <img
          *ngIf="outfit.bottom.image && !hasImgError('bottom')"
          [src]="outfit.bottom.image"
          [alt]="outfit.bottom.title"
          class="product-img"
          (error)="onImgError('bottom')"
        />
        <div *ngIf="!outfit.bottom.image || hasImgError('bottom')"
          class="color-swatch" [style.background]="outfit.bottom.color">
        </div>
        <span class="brand-badge" *ngIf="outfit.bottom.brand">{{ outfit.bottom.brand }}</span>
      </div>
      <div class="product-info">
        <span class="product-type">BOTTOM</span>
        <p class="product-title">{{ outfit.bottom.title || 'Bottom Wear' }}</p>
        <p class="product-price" *ngIf="outfit.bottom.price">₹{{ outfit.bottom.price }}</p>
      </div>
    </div>

  </div>

  <!-- Shoe note (small text suggestion, replaces accessory) -->
  <div class="shoe-note" *ngIf="outfit.shoe_note">
    <span class="compat-icon">👟</span>
    <p>{{ outfit.shoe_note }}</p>
  </div>

  <!-- Note -->
  <div class="compat-note" *ngIf="outfit.note">
    <span class="compat-icon">✦</span>
    <p>{{ outfit.note }}</p>
  </div>

  <!-- ONE View Details per outfit -->
  <button class="view-details-btn" (click)="viewDetails.emit(outfit)">
    View Details
    <svg width="12" height="12" viewBox="0 0 10 10" fill="none">
      <path d="M1 9L9 1M9 1H4M9 1V6" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

</div>
