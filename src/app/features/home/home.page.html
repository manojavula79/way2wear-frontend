<div class="page-shell">

  <div
    class="overlay"
    [class.visible]="sideMenuOpen() || profileOpen()"
    (click)="closeSideMenu(); closeProfile()"
  ></div>

  <div class="drawer drawer-left" [class.open]="sideMenuOpen()">
    <app-side-menu
      (closed)="closeSideMenu()"
      (newSession)="onNewSession()"
      (sessionSelected)="onSessionSelected($event)"
    ></app-side-menu>
  </div>

  <div class="drawer drawer-right" [class.open]="profileOpen()">
    <app-profile-panel (closed)="closeProfile()"></app-profile-panel>
  </div>

  <div class="app-shell">

    <header class="navbar">
      <button class="nav-btn" (click)="toggleSideMenu()" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M2.5 5.5h15M2.5 10h15M2.5 14.5h15"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>

      <span class="navbar-title">Way2Wear</span>

      <button class="profile-btn" (click)="toggleProfile()" aria-label="Open profile">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="6.5" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M2.5 15.5c0-3.314 2.91-6 6.5-6s6.5 2.686 6.5 6"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <main class="main-content" #mainContent>

      <div class="hero-section" *ngIf="!hasMessages()">
        <div class="hero-inner">
          <h1 class="hero-title">From idea to outfit<br/>in seconds</h1>
          <p class="hero-sub1">Tell us where. We style you. 🔥</p>
          <p class="hero-sub2">Stop scrolling. Start wearing.</p>

          <div class="suggestion-chips">
            <button
              class="chip"
              *ngFor="let s of suggestions"
              (click)="onSuggestionClick(s)"
            >{{ s }}</button>
          </div>
        </div>
      </div>

      <div class="messages-list" *ngIf="hasMessages()">
        <app-message-bubble
          *ngFor="let message of messages(); trackBy: trackById"
          [message]="message"
          (viewDetails)="selectedOutfit.set($event)"
        ></app-message-bubble>

        <app-typing-indicator *ngIf="isLoading()"></app-typing-indicator>

        <div #messagesEnd class="scroll-anchor"></div>
      </div>

    </main>

    <footer class="input-footer">
      <app-message-input
        (messageSent)="onMessageSent($event)"
      ></app-message-input>
    </footer>

  </div>

  <!-- Outfit detail modal -->
  <app-outfit-detail
    *ngIf="selectedOutfit() as o"
    [outfit]="o"
    (close)="selectedOutfit.set(null)">
  </app-outfit-detail>
</div>
